<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Gradient and contour lines</title><desc>Elliptical contour lines of x²+2y²; at (1, 1), the gradient and negative gradient are normal to the contour line.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" font-weight="700" fill="#253d59">Gradient and contour lines</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><line x1="20" y1="300" x2="467" y2="300" stroke="#9daab6" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="220" y1="438" x2="220" y2="85" stroke="#9daab6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="472" y="305" text-anchor="start" font-size="16" font-weight="normal" fill="#253d59">x</text><text x="229" y="84" text-anchor="start" font-size="16" font-weight="normal" fill="#253d59">y</text><ellipse cx="220" cy="300" rx="63.63961030678928" ry="45.0" fill="none" stroke="#a4b7c5" stroke-width="2.5"/><ellipse cx="220" cy="300" rx="110.22703842524301" ry="77.94228634059948" fill="none" stroke="#a4b7c5" stroke-width="2.5"/><ellipse cx="220" cy="300" rx="155.88457268119896" ry="110.22703842524301" fill="none" stroke="#18688c" stroke-width="2.5"/><circle cx="310" cy="210" r="5" fill="#1c6585"/><line x1="310" y1="210" x2="345" y2="140" stroke="#18688c" stroke-width="3" marker-end="url(#arrow)"/><line x1="310" y1="210" x2="275" y2="280" stroke="#ba6632" stroke-width="3" marker-end="url(#arrow)"/><text x="318" y="229" text-anchor="start" font-size="16" font-weight="normal" fill="#253d59">(1, 1)</text><text x="495" y="145" text-anchor="start" font-size="22" font-weight="700" fill="#253d59">g(x, y) = x² + 2y²</text><text x="495" y="195" text-anchor="start" font-size="19" font-weight="normal" fill="#253d59">Contour line: g = 3</text><text x="495" y="240" text-anchor="start" font-size="19" font-weight="normal" fill="#253d59">Ascent: ∇g = (2, 4)</text><text x="495" y="280" text-anchor="start" font-size="19" font-weight="normal" fill="#253d59">Descent: −∇g = (−2, −4)</text><line x1="458" y1="234" x2="482" y2="234" stroke="#18688c" stroke-width="3"/><line x1="458" y1="274" x2="482" y2="274" stroke="#ba6632" stroke-width="3"/><text x="495" y="342" text-anchor="start" font-size="16" font-weight="normal" fill="#253d59">Arrows proportional to the gradient</text></g></svg>