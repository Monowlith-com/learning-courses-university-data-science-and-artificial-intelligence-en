<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" fill="#fff"/><text x="34" y="35" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="start" fill="#263443" font-weight="bold">Odd summands form squares</text><text x="34" y="64" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" fill="#66727e" font-weight="normal">Induction illustrated by dot patterns for n = 1 to 4.</text><line x1="34" y1="82" x2="866" y2="82" stroke="#c8d1d8" stroke-width="1"/><text x="450" y="120" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" fill="#263443" font-weight="bold">Each new border adds exactly 2n − 1 dots.</text><circle cx="135.0" cy="255.0" r="10" fill="#287b69"/><text x="135" y="359" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#263443" font-weight="bold">1² = 1</text><text x="135" y="391" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#287b69" font-weight="normal">+ 1 new</text><circle cx="313.5" cy="238.5" r="10" fill="#326b96"/><circle cx="346.5" cy="238.5" r="10" fill="#287b69"/><circle cx="313.5" cy="271.5" r="10" fill="#287b69"/><circle cx="346.5" cy="271.5" r="10" fill="#287b69"/><text x="330" y="359" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#263443" font-weight="bold">2² = 4</text><text x="330" y="391" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#287b69" font-weight="normal">+ 3 new</text><circle cx="502.0" cy="222.0" r="10" fill="#326b96"/><circle cx="535.0" cy="222.0" r="10" fill="#326b96"/><circle cx="568.0" cy="222.0" r="10" fill="#287b69"/><circle cx="502.0" cy="255.0" r="10" fill="#326b96"/><circle cx="535.0" cy="255.0" r="10" fill="#326b96"/><circle cx="568.0" cy="255.0" r="10" fill="#287b69"/><circle cx="502.0" cy="288.0" r="10" fill="#287b69"/><circle cx="535.0" cy="288.0" r="10" fill="#287b69"/><circle cx="568.0" cy="288.0" r="10" fill="#287b69"/><text x="535" y="359" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#263443" font-weight="bold">3² = 9</text><text x="535" y="391" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#287b69" font-weight="normal">+ 5 new</text><circle cx="705.5" cy="205.5" r="10" fill="#326b96"/><circle cx="738.5" cy="205.5" r="10" fill="#326b96"/><circle cx="771.5" cy="205.5" r="10" fill="#326b96"/><circle cx="804.5" cy="205.5" r="10" fill="#287b69"/><circle cx="705.5" cy="238.5" r="10" fill="#326b96"/><circle cx="738.5" cy="238.5" r="10" fill="#326b96"/><circle cx="771.5" cy="238.5" r="10" fill="#326b96"/><circle cx="804.5" cy="238.5" r="10" fill="#287b69"/><circle cx="705.5" cy="271.5" r="10" fill="#326b96"/><circle cx="738.5" cy="271.5" r="10" fill="#326b96"/><circle cx="771.5" cy="271.5" r="10" fill="#326b96"/><circle cx="804.5" cy="271.5" r="10" fill="#287b69"/><circle cx="705.5" cy="304.5" r="10" fill="#287b69"/><circle cx="738.5" cy="304.5" r="10" fill="#287b69"/><circle cx="771.5" cy="304.5" r="10" fill="#287b69"/><circle cx="804.5" cy="304.5" r="10" fill="#287b69"/><text x="755" y="359" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#263443" font-weight="bold">4² = 16</text><text x="755" y="391" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#287b69" font-weight="normal">+ 7 new</text><text x="450" y="435" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" fill="#263443" font-weight="normal">1 + 3 + 5 + 7 = 16</text></svg>