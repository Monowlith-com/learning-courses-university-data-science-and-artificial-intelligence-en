<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Broadcasting a column offset</title><desc>A 3 × 2 matrix minus an offset vector of length 2 yields a 3 × 2 matrix.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526171"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Broadcasting a column offset</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><text x="170" y="133" font-size="20" text-anchor="middle" fill="#263747" font-weight="600">Data matrix (3 × 2)</text><text x="450" y="133" font-size="20" text-anchor="middle" fill="#263747" font-weight="600">Offset (2,)</text><text x="730" y="133" font-size="20" text-anchor="middle" fill="#263747" font-weight="600">Result (3 × 2)</text><rect x="105" y="165" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="137.5" y="203.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">5</text><rect x="170" y="165" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="202.5" y="203.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">9</text><rect x="105" y="227" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="137.5" y="265.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">7</text><rect x="170" y="227" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="202.5" y="265.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">13</text><rect x="105" y="289" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="137.5" y="327.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">9</text><rect x="170" y="289" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="202.5" y="327.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">17</text><rect x="385" y="165" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="417.5" y="203.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">2</text><rect x="450" y="165" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="482.5" y="203.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">3</text><rect x="665" y="165" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="697.5" y="203.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">3</text><rect x="730" y="165" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="762.5" y="203.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">6</text><rect x="665" y="227" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="697.5" y="265.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">5</text><rect x="730" y="227" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="762.5" y="265.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">10</text><rect x="665" y="289" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="697.5" y="327.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">7</text><rect x="730" y="289" width="65" height="62" rx="6" fill="#f1f6fa" stroke="#b0bec9" stroke-width="2"/><text x="762.5" y="327.0" font-size="22" text-anchor="middle" fill="#263747" font-weight="400">14</text><text x="305" y="255" font-size="34" text-anchor="middle" fill="#263747" font-weight="400">−</text><text x="585" y="255" font-size="34" text-anchor="middle" fill="#263747" font-weight="400">=</text><text x="450" y="391" font-size="20" text-anchor="middle" fill="#263747" font-weight="400">The same offset vector is subtracted from every row.</text></svg>
