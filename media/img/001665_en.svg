<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Access roles in a data pipeline</title><desc>Raw dataset, transformation service and approved analytics table with separate roles and a separately protected mapping.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627180"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="32" y="43" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#26313d">Access roles in a data pipeline</text><line x1="32" y1="62" x2="868" y2="62" stroke="#c9ced4" stroke-width="1"/><rect x="35" y="170" width="230" height="90" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="150.0" y="208.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Raw dataset</text><text x="150.0" y="233.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">restricted access</text><rect x="335" y="170" width="230" height="90" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="450.0" y="208.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Transformation</text><text x="450.0" y="233.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">minimise</text><rect x="635" y="170" width="230" height="90" rx="5" fill="#edf5ed" stroke="#38765b" stroke-width="1.6"/><text x="750.0" y="208.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Analytics table</text><text x="750.0" y="233.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">approved data</text><line x1="265" y1="215" x2="335" y2="215" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><line x1="565" y1="215" x2="635" y2="215" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><text x="150" y="139" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Ingestion: write</text><text x="750" y="139" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Analytics: read</text><rect x="335" y="325" width="230" height="78" rx="5" fill="#fff1e8" stroke="#a44d25" stroke-width="1.6"/><text x="450.0" y="357.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Mapping table</text><text x="450.0" y="382.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">separate protection</text><line x1="450" y1="260" x2="450" y2="325" stroke="#627180" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 5"/><text x="612" y="320" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a44d25">authorised only</text></svg>
