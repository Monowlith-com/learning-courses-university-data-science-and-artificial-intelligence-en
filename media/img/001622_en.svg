<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Three types of learning in operation</title><desc>Supervised learning uses measurements and failure labels, unsupervised learning only measurements, and reinforcement learning state and reward with feedback through the environment.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687985"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" fill="#253d59" font-weight="700">Three types of learning in operation</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><text x="34" y="148" text-anchor="start" font-size="20" fill="#253d59" font-weight="700">Supervised</text><rect x="240" y="112" width="235" height="75" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="357.5" y="144.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Measurements</text><text x="357.5" y="166.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">+ failure labels</text><line x1="475" y1="149" x2="531" y2="149" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="112" width="325" height="75" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="702.5" y="155.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Failure prediction</text><text x="34" y="259" text-anchor="start" font-size="20" fill="#253d59" font-weight="700">Unsupervised</text><rect x="240" y="223" width="235" height="75" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="357.5" y="266.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Measurements only</text><line x1="475" y1="260" x2="531" y2="260" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="223" width="325" height="75" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="702.5" y="266.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Operating groups</text><text x="34" y="370" text-anchor="start" font-size="20" fill="#253d59" font-weight="700">Reinforcement</text><rect x="240" y="334" width="235" height="75" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="357.5" y="366.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">State and</text><text x="357.5" y="388.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">reward</text><line x1="475" y1="371" x2="531" y2="371" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="334" width="325" height="75" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="702.5" y="377.5" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Action: cooling power</text><line x1="700" y1="409" x2="700" y2="434" stroke="#687985" stroke-width="2"/><line x1="700" y1="434" x2="355" y2="434" stroke="#687985" stroke-width="2"/><line x1="355" y1="434" x2="355" y2="409" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><text x="527" y="428" text-anchor="middle" font-size="15" fill="#253d59" font-weight="400">Environment responds</text></g></svg>