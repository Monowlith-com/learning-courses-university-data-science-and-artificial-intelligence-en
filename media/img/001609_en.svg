<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>A possible confounder</title><desc>Damage complexity influences staffing and working time; the direct effect must be investigated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#253d59"><text x="32" y="45" font-size="25" font-weight="700">A possible confounder</text><path d="M32 65 H868" stroke="#d1d5db" stroke-width="1.5"/><rect x="320" y="100" width="260" height="70" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="450.0" y="141.0" font-size="17" text-anchor="middle" font-weight="700">Damage complexity</text><rect x="55" y="282" width="265" height="70" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="187.5" y="323.0" font-size="17" text-anchor="middle" font-weight="700">Staffing</text><rect x="580" y="282" width="265" height="70" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="712.5" y="323.0" font-size="17" text-anchor="middle" font-weight="700">Working time</text><path d="M380 170 L190 282" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 170 L710 282" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 317 L580 317" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="450" y="299" font-size="15" text-anchor="middle">Effect to investigate</text><text x="450" y="407" font-size="18" text-anchor="middle">Arrows represent assumptions about possible causal relationships.</text></g></svg>