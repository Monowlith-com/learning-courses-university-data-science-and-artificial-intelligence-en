<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Iterative data lifecycle</title><desc>Six processing stages with feedback to the objective definition.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#253d59"><text x="32" y="45" font-size="25" font-weight="700">Iterative data lifecycle</text><path d="M32 65 H868" stroke="#d1d5db" stroke-width="1.5"/><rect x="38" y="110" width="235" height="65" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="155.5" y="148.5" font-size="17" text-anchor="middle" font-weight="700">Define objective</text><rect x="333" y="110" width="235" height="65" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="450.5" y="148.5" font-size="17" text-anchor="middle" font-weight="700">Collect data</text><rect x="628" y="110" width="235" height="65" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="745.5" y="148.5" font-size="17" text-anchor="middle" font-weight="700">Check data</text><rect x="628" y="280" width="235" height="65" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="745.5" y="318.5" font-size="17" text-anchor="middle" font-weight="700">Fit model</text><rect x="333" y="280" width="235" height="65" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="450.5" y="318.5" font-size="17" text-anchor="middle" font-weight="700">Evaluate model</text><rect x="38" y="280" width="235" height="65" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="155.5" y="318.5" font-size="17" text-anchor="middle" font-weight="700">Monitor deployment</text><path d="M273 142 L333 142" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 142 L628 142" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 175 L745 280" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M628 312 L568 312" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M333 312 L273 312" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><path d="M155 280 L155 175" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="450" y="410" font-size="18" text-anchor="middle">Revisit earlier steps when new insights emerge.</text></g></svg>