<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Local aggregation before the shuffle</title><desc>Three local sum and count pairs are combined into (72,9); overall mean 8.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627180"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="32" y="43" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#26313d">Local aggregation before the shuffle</text><line x1="32" y1="62" x2="868" y2="62" stroke="#c9ced4" stroke-width="1"/><rect x="55" y="120" width="210" height="76" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="160.0" y="151.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Partition 1</text><text x="160.0" y="176.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">(18, 3)</text><line x1="160" y1="196" x2="450" y2="285" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><rect x="345" y="120" width="210" height="76" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="450.0" y="151.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Partition 2</text><text x="450.0" y="176.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">(24, 4)</text><line x1="450" y1="196" x2="450" y2="285" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><rect x="635" y="120" width="210" height="76" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="740.0" y="151.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Partition 3</text><text x="740.0" y="176.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">(30, 2)</text><line x1="740" y1="196" x2="450" y2="285" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><rect x="320" y="285" width="260" height="80" rx="5" fill="#edf5ed" stroke="#38765b" stroke-width="1.6"/><text x="450.0" y="318.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Sum and count</text><text x="450.0" y="343.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">(72, 9)</text><text x="450" y="411" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#38765b">Overall mean = 72 / 9 = 8</text></svg>
