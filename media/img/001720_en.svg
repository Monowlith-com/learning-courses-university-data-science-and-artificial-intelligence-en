<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Left join with an unmatched key</title><desc>Four deliveries are matched to two warehouse reference records; Z has no region.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526171"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Left join with an unmatched key</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><text x="200" y="117" font-size="21" text-anchor="middle" fill="#263747" font-weight="600">Deliveries</text><text x="680" y="117" font-size="21" text-anchor="middle" fill="#263747" font-weight="600">Reference data</text><rect x="90" y="137" width="220" height="48" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="200.0" y="168.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">X   |   5 kg</text><rect x="90" y="202" width="220" height="48" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="200.0" y="233.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">X   |   7 kg</text><rect x="90" y="267" width="220" height="48" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="200.0" y="298.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Y   |   4 kg</text><rect x="90" y="332" width="220" height="48" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="200.0" y="363.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Z   |   2 kg</text><rect x="565" y="155" width="235" height="58" rx="6" fill="#eaf5ed" stroke="#27764b" stroke-width="2"/><text x="682.5" y="191.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">X   |   Nord</text><rect x="565" y="245" width="235" height="58" rx="6" fill="#eaf5ed" stroke="#27764b" stroke-width="2"/><text x="682.5" y="281.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Y   |   Sued</text><line x1="310" y1="161" x2="565" y2="184" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="310" y1="226" x2="565" y2="184" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="310" y1="291" x2="565" y2="274" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="310" y1="356" x2="565" y2="365" stroke="#a44440" stroke-width="2.3" marker-end="url(#a)"/><rect x="565" y="340" width="235" height="50" rx="6" fill="#faeeeb" stroke="#a44440" stroke-width="2"/><text x="682.5" y="372.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">no region</text><text x="450" y="432" font-size="19" text-anchor="middle" fill="#263747" font-weight="400">All four deliveries are retained.</text></svg>
