nt-weight="400">6</text><line x1="806" y1="100" x2="806" y2="350" stroke="#e3e7eb" stroke-width="1"/><text x="806" y="377" text-anchor="middle" font-size="16" fill="#253d59" font-weight="400">7</text><text x="34" y="179" text-anchor="start" font-size="22" fill="#253d59" font-weight="700">Rule A</text><rect x="225" y="143" width="83" height="62" rx="0" fill="#a4b7c5" stroke="#a4b7c5" stroke-width="1.5"/><text x="266.5" y="182" text-anchor="middle" font-size="16" fill="#253d59" font-weight="700">1</text><rect x="308" y="143" width="332" height="62" rx="0" fill="#ba6632" stroke="#ba6632" stroke-width="1.5"/><text x="474.0" y="182" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">4</text><rect x="640" y="143" width="55.33333333333333" height="62" rx="0" fill="#18688c" stroke="#18688c" stroke-width="1.5"/><text x="667.6666666666666" y="182" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">2/3</text><text x="707.3333333333334" y="182" text-anchor="start" font-size="17" fill="#253d59" font-weight="400">≈ 5.67</text><text x="34" y="288" text-anchor="start" font-size="22" fill="#253d59" font-weight="700">Rule B</text><rect x="225" y="252" width="83" height="62" rx="0" fill="#a4b7c5" stroke="#a4b7c5" stroke-width="1.5"/><text x="266.5" y="291" text-anchor="middle" font-size="16" fill="#253d59" font-weight="700">1</text><rect x="308" y="252" width="498" height="62" rx="0" fill="#18688c" stroke="#18688c" stroke-width="1.5"/><text x="557.0" y="291" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">6</text><text x="818" y="291" text-anchor="start" font-size="17" fill="#253d59" font-weight="400">7</text><rect x="170" y="408" width="19" height="19" rx="0" fill="#a4b7c5" stroke="#a4b7c5" stroke-width="1.5"/><text x="198" y="423" text-anchor="start" font-size="17" fill="#253d59" font-weight="400">Residual variance</text><rect x="395" y="408" width="19" height="19" rx="0" fill="#ba6632" stroke="#ba6632" stroke-width="1.5"/><text x="423