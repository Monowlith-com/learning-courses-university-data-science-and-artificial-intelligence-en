<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Grouping in R</title><desc>Four measured times are split by workshop and averaged to 10 and 8 minutes respectively.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526171"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Grouping in R</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><rect x="330" y="110" width="240" height="62" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="450.0" y="135.5" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Four measurements</text><text x="450.0" y="160.5" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">A: 8, 12 | B: 6, 10</text><line x1="410" y1="172" x2="240" y2="230" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="490" y1="172" x2="660" y2="230" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="95" y="230" width="290" height="65" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="240.0" y="257.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Workshop A</text><text x="240.0" y="282.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">8 and 12 min</text><rect x="515" y="230" width="290" height="65" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="660.0" y="257.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Workshop B</text><text x="660.0" y="282.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">6 and 10 min</text><line x1="240" y1="295" x2="240" y2="345" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="660" y1="295" x2="660" y2="345" stroke="#526171" stroke-