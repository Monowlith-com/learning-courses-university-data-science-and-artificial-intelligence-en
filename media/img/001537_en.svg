<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Count-Min Sketch with collisions</title><desc>Two hash rows, A has frequency five; in row one B collides with A, but not in row two. The minimum of the marked counters is five.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627180"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="32" y="43" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#26313d">Count-Min Sketch with collisions</text><line x1="32" y1="62" x2="868" y2="62" stroke="#c9ced4" stroke-width="1"/><text x="450" y="105" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#26313d">Input: A × 5, B × 2, C × 3</text><text x="105" y="190" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Hash row 1</text><rect x="200" y="160" width="130" height="65" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="265.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">0</text><text x="265.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">–</text><rect x="348" y="160" width="130" height="65" rx="5" fill="#e1f0e4" stroke="#38765b" stroke-width="1.6"/><text x="413.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">7</text><text x="413.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">A+B</text><rect x="496" y="160" width="130" height="65" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="561.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">3</text><text x="561.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">C</text><rect x="644" y="160" width="130" height="65" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="709.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">0</text><text x="709.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">–</text><text x="105" y="295" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Hash row 2</text><rect x="200" y="265" width="130" height="65" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="265.0" y="291.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">2</text><text x="265.0" y="316.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">B</text><rect x="348" y="265" width="130" height="65" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="413.0" y="291.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">3</text><text x="413.0" y="316.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">C</text><rect x="496" y="265" width="130" height="65" rx="5" fill="#e1f0e4" stroke="#38765b" stroke-width="1.6"/><text x="561.0" y="291.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">5</text><text x="561.0" y="316.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">A</text><rect x="644" y="265" width="130" height="65" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="709