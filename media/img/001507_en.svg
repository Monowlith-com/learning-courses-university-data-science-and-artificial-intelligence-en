<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Conditional and marginal independence</title><desc>Averaging two conditional tables with independent alarms yields a dependent joint distribution.</desc><rect width="900" height="460" fill="white"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Conditional and marginal independence</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><text x="170" y="125" font-size="19" text-anchor="middle" fill="#263747" font-weight="600">Low load</text><text x="125" y="163" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">B = 1</text><text x="215" y="163" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">B = 0</text><rect x="80" y="180" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="125" y="228" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.04</text><rect x="170" y="180" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="215" y="228" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.16</text><rect x="80" y="265" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="125" y="313" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.16</text><rect x="170" y="265" width="90" height="85" fill="#c2dbea" stroke="#245e91" stroke-width="1.5"/><text x="215" y="313" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.64</text><text x="72" y="226" font-size="13" text-anchor="end" fill="#263747" font-weight="400">A=1</text><text x="72" y="311" font-size="13" text-anchor="end" fill="#263747" font-weight="400">A=0</text><text x="170" y="374" font-size="19" text-anchor="middle" fill="#245e91" font-weight="600">independent</text><text x="455" y="125" font-size="19" text-anchor="middle" fill="#263747" font-weight="600">High load</text><text x="410" y="163" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">B = 1</text><text x="500" y="163" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">B = 0</text><rect x="365" y="180" width="90" height="85" fill="#c2dbea" stroke="#245e91" stroke-width="1.5"/><text x="410" y="228" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.64</text><rect x="455" y="180" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="500" y="228" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.16</text><rect x="365" y="265" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="410" y="313" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.16</text><rect x="455" y="265" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="500" y="313" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.04</text><text x="357" y="226" font-size="13" text-anchor="end" fill="#263747" font-weight="400">A=1</text><text x="357" y="311" font-size="13" text-anchor="end" fill="#263747" font-weight="400">A=0</text><text x="455" y="374" font-size="19" text-anchor="middle" fill="#245e91" font-weight="600">independent</text><text x="740" y="125" font-size="19" text-anchor="middle" fill="#263747" font-weight="600">Load unknown</text><text x="695" y="163" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">B = 1</text><text x="785" y="163" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">B = 0</text><rect x="650" y="180" width="90" height="85" fill="#c2dbea" stroke="#245e91" stroke-width="1.5"/><text x="695" y="228" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.34</text><rect x="740" y="180" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="785" y="228" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.16</text><rect x="650" y="265" width="90" height="85" fill="#f0f4f7" stroke="#245e91" stroke-width="1.5"/><text x="695" y="313" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.16</text><rect x="740" y="265" width="90" height="85" fill="#c2dbea" stroke="#245e91" stroke-width="1.5"/><text x="785" y="313" font-size="21" text-anchor="middle" fill="#263747" font-weight="400">0.34</text><text x="642" y="226" font-size="13" text-anchor="end" fill="#263747" font-weight="400">A=1</text><text x="642" y="311" font-size="13" text-anchor="end" fill="#263747" font-weight="400">A=0</text><text x="740" y="374" font-size="19" text-anchor="middle" fill="#b66a26" font-weight="600">dependent</text><text x="450" y="427" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">Both load states have probability 0.5.</text></svg>