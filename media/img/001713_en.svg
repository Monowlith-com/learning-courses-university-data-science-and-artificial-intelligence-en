<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Star schema for laboratory analytics</title><desc>Central measurement facts with device key, date key and measurement duration, linked to two dimensions.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627180"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="32" y="43" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#26313d">Star schema for laboratory analytics</text><line x1="32" y1="62" x2="868" y2="62" stroke="#c9ced4" stroke-width="1"/><rect x="330" y="140" width="240" height="180" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="450.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Measurement facts</text><text x="450.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Measurement ID</text><text x="450.0" y="236.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Device key</text><text x="450.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Date key</text><text x="450.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Duration (s)</text><rect x="40" y="170" width="235" height="120" rx="5" fill="#edf5ed" stroke="#38765b" stroke-width="1.6"/><text x="157.5" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Device</text><text x="157.5" y="236.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Device key</text><text x="157.5" y="261.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Location</text><rect x="625" y="170" width="235" height="120" rx="5" fill="#edf5ed" stroke="#38765b" stroke-width="1.6"/><text x="742.5" y="211.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Date</text><text x="742.5" y="236.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Date key</text><text x="742.5" y="261.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#26313d">Calendar week</text><line x1="275" y1="230" x2="330" y2="230" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><line x1="625" y1="230" x2="570" y2="230" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="370" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#26313d">One fact row per measurement event</text></svg>
