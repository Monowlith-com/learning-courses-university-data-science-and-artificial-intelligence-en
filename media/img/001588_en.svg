<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6.8" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="900" height="460" fill="#fff" stroke="none" stroke-width="1.5"/><text x="35" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" text-anchor="start" fill="#202b38" font-weight="bold">Gradients Across Two Processes</text><text x="35" y="74" font-family="DejaVu Sans,sans-serif" font-size="17" text-anchor="start" fill="#64748b" font-weight="normal">Unequal local batch sizes need proper weights</text><line x1="35" y1="91" x2="865" y2="91" stroke="#d2d6dc" stroke-width="1"/><rect x="90" y="122" width="300" height="84" fill="#dbeaf3" stroke="#266b98" stroke-width="1.5"/><text x="240.0" y="164.0" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#202b38" font-weight="bold">Process A · n = 2</text><text x="240.0" y="189.0" font-family="DejaVu Sans,sans-serif" font-size="16" text-anchor="middle" fill="#202b38" font-weight="normal">Gradients 2, 4 → mean 3</text><rect x="510" y="122" width="300" height="84" fill="#dbeaf3" stroke="#266b98" stroke-width="1.5"/><text x="660.0" y="164.0" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#202b38" font-weight="bold">Process B · n = 4</text><text x="660.0" y="189.0" font-family="DejaVu Sans,sans-serif" font-size="16" text-anchor="middle" fill="#202b38" font-weight="normal">Gradients 1, 1, 3, 5 → mean 2.5</text><line x1="240" y1="206" x2="360" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="660" y1="206" x2="540" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="238" y="270" width="424" height="85" fill="#faeadc" stroke="#b4672b" stroke-width="1.5"/><text x="450.0" y="312.5" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#202b38" font-weight="bold">Weighted aggregation</text><text x="450.0" y="337.5" font-family="DejaVu Sans,sans-serif" font-size="16" text-anchor="middle" fill="#202b38" font-weight="normal">(2 × 3 + 4 × 2.5) / 6 = 2.667</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="20" text-anchor="middle" fill="#202b38" font-weight="bold">Unweighted mean 2.75 would be incorrect.</text></svg>