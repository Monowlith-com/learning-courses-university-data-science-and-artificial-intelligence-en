<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6.8" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="900" height="460" fill="#fff" stroke="none" stroke-width="1.5"/><text x="35" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" text-anchor="start" fill="#202b38" font-weight="bold">From a Change to a Verified Patch</text><text x="35" y="74" font-family="DejaVu Sans,sans-serif" font-size="17" text-anchor="start" fill="#64748b" font-weight="normal">Isolated candidates and independent requirements</text><line x1="35" y1="91" x2="865" y2="91" stroke="#d2d6dc" stroke-width="1"/><rect x="65" y="125" width="205" height="63" fill="#dbeaf3" stroke="#266b98" stroke-width="1.5"/><text x="167.5" y="163.5" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#202b38" font-weight="bold">Task + baseline</text><rect x="350" y="125" width="205" height="63" fill="#dbeaf3" stroke="#266b98" stroke-width="1.5"/><text x="452.5" y="163.5" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#202b38" font-weight="bold">Isolated patch</text><rect x="615" y="125" width="250" height="63" fill="#dbeaf3" stroke="#266b98" stroke-width="1.5"/><text x="740.0" y="163.5" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middle" fill="#202b38" font-weight="bold">Independent tests</text><line x1="270" y1="156" x2="344" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="555" y1="156" x2="609" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="188" x2="740" y2="247" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="615" y="252" width="250" height="68" fill="#dbeaf3" stroke="#266b98" stroke-width="1.5"/><text x="740.0" y="286.0" font-family="DejaVu Sans,sans-serif" font-size="19" text-anchor="middl