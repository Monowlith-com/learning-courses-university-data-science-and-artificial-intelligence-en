<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Linear SVM: decision boundary and margin</title><desc>Two classes at x1=1 and x1=3; decision boundary x1=2 and margin width 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8392a1"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" font-size="25" text-anchor="start" fill="#253d59" font-weight="700">Linear SVM: decision boundary and margin</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><rect x="230" y="102" width="210" height="276" rx="0" fill="#f5f7f8" stroke="none" stroke-width="1.5"/><line x1="125" y1="378" x2="555.5" y2="378" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><line x1="125" y1="378" x2="125" y2="94" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="402" font-size="15" text-anchor="middle" fill="#253d59" font-weight="400">1</text><text x="335" y="402" font-size="15" text-anchor="middle" fill="#253d59" font-weight="400">2</text><text x="440" y="402" font-size="15" text-anchor="middle" fill="#253d59" font-weight="400">3</text><text x="545" y="402" font-size="15" text-anchor="middle" fill="#253d59" font-weight="400">4</text><text x="110" y="295" font-size="15" text-anchor="end" fill="#253d59" font-weight="400">1</text><text x="110" y="207" font-size="15" text-anchor="end" fill="#253d59" font-weight="400">2</text><text x="110" y="119" font-size="15" text-anchor="end" fill="#253d59" font-weight="400">3</text><line x1="230" y1="105" x2="230" y2="378" stroke="#8392a1" stroke-width="2" stroke-dasharray="7 4"/><line x1="335" y1="105" x2="335" y2="378" stroke="#253d59" stroke-width="3"/><line x1="440" y1="105" x2="440" y2="378" stroke="#8392a1" stroke-width="2" stroke-dasharray="7 4"/><circle cx="230" cy="290" r="9" fill="#18688c"/><circle cx="230" cy="114" r="9" fill="#18688c"/><circle cx="440" cy="290" r="9" fill="#b34b36"/><circle cx="440" cy="114" r="9" fill="#b34b36"/><text x="580" y="149" font-size="20" text-anchor="start" fill="#18688c" font-weight="700">Class −1</text><text x="580" y="187" font-size="20" text-anchor="start" fill="#b34b36" font-weight="700">Class +1</text><text x="580" y="245" font-size="20" text-anchor="start" fill="#253d59" font-weight="400">Boundary: x₁ = 2</text><text x="580" y="280" font-size="19" text-anchor="start" fill="#253d59" font-weight="400">Margins: x₁ = 1 and 3</text><text x="580" y="325" font-size="22" text-anchor="start" fill="#253d59" font-weight="700">Margin width = 2</text><line x1="230" y1="337" x2="440" y2="337" stroke="#27765a" stroke-width="3"/><line x1="230" y1="328" x2="230" y2="346" stroke="#27765a" stroke-width="2"/><line x1="440" y1="328" x2="440" y2="346" stroke="#27765a" stroke-width="2"/><text x="335" y="328" font-size="17" text-anchor="middle" fill="#27765a" font-weight="700">2</text><text x="572" y="395" font-size="17" text-anchor="start" fill="#253d59" font-weight="400">x₁</text><text x="100" y="95" font-size="17" text-anchor="start" fill="#253d59" font-weight="400">x₂</text></g></svg>