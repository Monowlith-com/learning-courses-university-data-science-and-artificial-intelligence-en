<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Cancellation with nearly equal numbers</title><desc>Direct subtraction gives zero in binary64; the rationalised formula gives approximately 5 times 10 to the power of −9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" font-weight="700" fill="#253d59">Cancellation with nearly equal numbers</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><text x="450" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#253d59">x = 100 000 000 · binary64</text><text x="239" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#253d59">Direct subtraction</text><rect x="48" y="175" width="382" height="52" rx="4" fill="#edf3f7" stroke="#a0adb9" stroke-width="1.4"/><text x="239" y="207" text-anchor="middle" font-size="18" font-weight="normal" fill="#253d59">√(x² + 1) → 100 000 000</text><line x1="239" y1="227" x2="239" y2="253" stroke="#758b9c" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="255" width="382" height="52" rx="4" fill="#edf3f7" stroke="#a0adb9" stroke-width="1.4"/><text x="239" y="287" text-anchor="middle" font-size="18" font-weight="normal" fill="#253d59">100 000 000 − 100 000 000</text><line x1="239" y1="307" x2="239" y2="333" stroke="#758b9c" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="335" width="382" height="52" rx="4" fill="#fff" stroke="#a94f35" stroke-width="1.4"/><text x="239" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#a94f35">Result: 0</text><text x="661" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#253d59">Rationalised form</text><rect x="470" y="175" width="382" height="52" rx="4" fill="#edf3f7" stroke="#a0adb9" stroke-width="1.4"/><text x="661" y="207" text-anchor="middle" font-size="18" font-weight="normal" fill="#253d59">√(x² + 1) + x → 200 000 000</text><line x1="661" y1="227" x2="661" y2="253" stroke="#758b9c" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="255" width="382" height="52" rx="4" fill="#edf3f7" stroke="#a0adb9" stroke-width="1.4"/><text x="661" y="287" text-anchor="middle" font-size="18" font-weight="normal" fill="#253d59">1 / 200 000 000</text><line x1="661" y1="307" x2="661" y2="333" stroke="#758b9c" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="335" width="382" height="52" rx="4" fill="#fff" stroke="#18688c" stroke-width="1.4"/><text x="661" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#18688c">Result: 5 · 10⁻⁹</text><text x="450" y="427" text-anchor="middle" font-size="18" font-weight="normal" fill="#253d59">Mathematically equivalent, numerically different.</text></g></svg>