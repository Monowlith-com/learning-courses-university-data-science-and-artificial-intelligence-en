<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Relational granularity</title><desc>A device can have several measurements; device 3 is retained by the left join.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627180"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="32" y="43" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#26313d">Relational granularity</text><line x1="32" y1="62" x2="868" y2="62" stroke="#c9ced4" stroke-width="1"/><text x="195" y="105" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#26313d">Devices (1 row per device)</text><text x="675" y="105" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#26313d">Measurements (1 row per event)</text><rect x="70" y="140" width="250" height="56" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="195.0" y="174.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">1  |  North</text><rect x="70" y="235" width="250" height="56" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="195.0" y="269.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">2  |  North</text><rect x="70" y="330" width="250" height="56" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="195.0" y="364.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">3  |  South</text><rect x="535" y="119" width="280" height="48" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="675.0" y="149.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">11  |  Device 1  |  4 s