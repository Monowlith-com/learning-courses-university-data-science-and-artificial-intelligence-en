<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" fill="#fff"/><text x="34" y="35" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="start" font-weight="bold">Research with data minimisation</text><text x="34" y="64" fill="#66727e" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="normal">Schematic design; legal and ethical review before using data.</text><line x1="34" y1="82" x2="866" y2="82" stroke="#c8d1d8" stroke-width="1"/><rect x="41" y="116" width="249" height="76" rx="5" fill="#edf4f8" stroke="#c8d1d8"/><text x="165.5" y="148.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Individual reservations</text><text x="165.5" y="172.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="normal">only with lawful access</text><rect x="326" y="116" width="248" height="76" rx="5" fill="#fff3e9" stroke="#b15d2b"/><text x="450.0" y="148.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Initial review</text><text x="450.0" y="172.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="normal">Purpose · law · risk</text><rect x="610" y="116" width="249" height="76" rx="5" fill="#e9f5f1" stroke="#287b69"/><text x="734.5" y="148.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Data-minimising</text><text x="734.5" y="172.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="normal">aggregation</text><line x1="292" y1="154" x2="324" y2="154" stroke="#66727e" stroke-width="2"/><polygon points="324,154 314.1927488298514,149.01825086083025 314.1927488298514,158.98174913916975" fill="#66727e"/><line x1="576" y1="154" x2="608" y2="154" stroke="#66727e" stroke-width="2"/><polygon points="608,154 598.1927488298513,149.01825086083025 598.1927488298513,158.98174913916975" fill="#66727e"/><line x1="450" y1="193" x2="450" y2="234" stroke="#b15d2b" stroke-width="2"/><polygon points="450,234 454.9817491391697,224.19274882985138 445.0182508608302,224.19274882985138" fill="#b15d2b"/><rect x="326" y="236" width="248" height="68" rx="5" fill="#fff3e9" stroke="#b15d2b"/><text x="450.0" y="264.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">If risk is unresolved</text><text x="450.0" y="288.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="normal">do not proceed</text><line x1="735" y1="193" x2="735" y2="234" stroke="#66727e" stroke-width="2"/><polygon points="735,234 739.9817491391698,224.19274882985138 730.0182508608302,224.19274882985138" fill="#66727e"/><rect x="610" y="236" width="249" height="68" rx="5" fill="#e9f5f1" stroke="#287b69"/><text x="734.5" y="264.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Analysis dataset</text><text x="734.5" y="288.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="normal">Daily values without IDs</text><line x1="735" y1="305" x2="735" y2="339" stroke="#66727e" stroke-width="2"/><polygon points="735,339 739.9817491391698,329.1927488298514 730.0182508608302,329.1927488298514" fill="#66727e"/><rect x="610" y="342" width="249" height="68" rx="5" fill="#e9f5f1" stroke="#287b69"/><text x="734.5" y="370.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Release review</text><text x="734.5" y="394.0" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="middle" font-weight="normal">Prevent re-identification</text><text x="43" y="365" fill="#263443" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="normal">No personal data needed in the model.</text><text x="43" y="393" fill="#66727e" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start" font-weight="normal">Aggregation is itself a processing step.</text></svg>
