<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Decision tree: gain from a split</title><desc>Root with four A and two B, three A on the left, one A and two B on the right; Gini gain 2/9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8392a1"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" font-size="25" text-anchor="start" fill="#253d59" font-weight="700">Decision tree: gain from a split</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><rect x="320" y="100" width="260" height="90" rx="5" fill="#fff" stroke="#253d59" stroke-width="1.5"/><text x="450.0" y="139.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">6 cases: 4 A, 2 B</text><text x="450.0" y="163.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">Gini = 4/9</text><line x1="390" y1="190" x2="230" y2="275" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><line x1="510" y1="190" x2="670" y2="275" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><text x="260" y="223" font-size="19" text-anchor="middle" fill="#253d59" font-weight="400">x ≤ 3.5</text><text x="640" y="223" font-size="19" text-anchor="middle" fill="#253d59" font-weight="400">x &gt; 3.5</text><rect x="105" y="275" width="250" height="90" rx="5" fill="#fff" stroke="#18688c" stroke-width="1.5"/><text x="230.0" y="314.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">3 A, 0 B</text><text x="230.0" y="338.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">Gini = 0</text><rect x="545" y="275" width="250" height="90" rx="5" fill="#fff" stroke="#b34b36" stroke-width="1.5"/><text x="670.0" y="314.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">1 A, 2 B</text><text x="670.0" y="338.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">Gini = 4/9</text><text x="450" y="421" font-size="23" text-anchor="middle" fill="#253d59" font-weight="700">Weighted impurity: 2/9   •   Gain: 2/9</text></g></svg>