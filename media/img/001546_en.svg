<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Validating a file interface</title><desc>Three CSV inputs are subjected to structure, type and range checks; only station 007 is valid.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526171"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Validating a file interface</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><text x="150" y="115" font-size="19" text-anchor="middle" fill="#263747" font-weight="600">CSV input</text><text x="450" y="115" font-size="19" text-anchor="middle" fill="#263747" font-weight="600">Check</text><text x="750" y="115" font-size="19" text-anchor="middle" fill="#263747" font-weight="600">Result</text><rect x="45" y="145" width="210" height="60" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="150.0" y="182.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">007;45</text><line x1="255" y1="175" x2="305" y2="175" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="305" y="145" width="290" height="60" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="450.0" y="182.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">45 is in [0, 100]</text><line x1="595" y1="175" x2="645" y2="175" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="645" y="145" width="210" height="60" rx="6" fill="#eaf5ed" stroke="#27764b" stroke-width="2"/><text x="750.0" y="182.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">valid</text><rect x="45" y="233" width="210" height="60" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="150.0" y="270.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">008;110</text><line x1="255" y1="263" x2="305" y2="263" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="305" y="233" width="290" height="60" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="450.0" y="270.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">110 exceeds 100</text><line x1="595" y1="263" x2="645" y2="263" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="645" y="233" width="210" height="60" rx="6" fill="#faeeeb" stroke="#a44440" stroke-width="2"/><text x="750.0" y="270.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Range error</text><rect x="45" y="321" width="210" height="60" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="150.0" y="358.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">009;NA</text><line x1="255" y1="351" x2="305" y2="351" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="305" y="321" width="290" height="60" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="450.0" y="358.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">NA is not a number</text><line x1="595" y1="351" x2="645" y2="351" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="645" y="321" width="210" height="60" rx="6" fill="#faeeeb" stroke="#a44440" stroke-width="2"/><text x="750.0" y="358.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Type error</text><text x="450" y="430" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Keep valid and flagged records separate.</text></svg>
