<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Training, validation and test</title><desc>Seventy per cent training, fifteen per cent each for validation and test; selection iterates only with development data, followed by final testing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687985"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" fill="#253d59" font-weight="700">Training, validation and test</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><rect x="42" y="110" width="560" height="60" rx="0" fill="#18688c" stroke="#18688c" stroke-width="1.5"/><text x="322.0" y="147" text-anchor="middle" font-size="19" fill="#fff" font-weight="700">700 · Training</text><rect x="602" y="110" width="120" height="60" rx="0" fill="#ba6632" stroke="#ba6632" stroke-width="1.5"/><text x="662.0" y="147" text-anchor="middle" font-size="19" fill="#fff" font-weight="700">150</text><rect x="722" y="110" width="120" height="60" rx="0" fill="#687985" stroke="#687985" stroke-width="1.5"/><text x="782.0" y="147" text-anchor="middle" font-size="19" fill="#fff" font-weight="700">150</text><text x="662" y="194" text-anchor="middle" font-size="15" fill="#253d59" font-weight="400">Validation</text><text x="782" y="194" text-anchor="middle" font-size="15" fill="#253d59" font-weight="400">Test</text><rect x="42" y="240" width="240" height="64" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="162.0" y="278.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Fit parameters</text><rect x="330" y="240" width="235" height="64" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="447.5" y="278.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Select model</text><rect x="617" y="240" width="240" height="64" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="737.0" y="278.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Test once</text><line x1="282" y1="272" x2="330" y2="272" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><line x1="565" y1="272" x2="617" y2="272" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><line x1="448" y1="304" x2="448" y2="350" stroke="#687985" stroke-width="2"/><line x1="448" y1="350" x2="162" y2="350" stroke="#687985" stroke-width="2"/><line x1="162" y1="350" x2="162" y2="304" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><text x="305" y="379" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Development data only</text><text x="737" y="350" text-anchor="middle" font-size="16" fill="#253d59" font-weight="400">Selection frozen</text><text x="450" y="428" text-anchor="middle" font-size="16" fill="#253d59" font-weight="400">Example: 1,000 independent observations; no fixed split rule.</text></g></svg>