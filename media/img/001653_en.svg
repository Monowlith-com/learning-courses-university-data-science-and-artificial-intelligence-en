<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Naive Bayes: from alerts to class probability</title><desc>Two classes with prior, conditional probabilities and unnormalised mass; normalisation gives 6/7 for a fault.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8392a1"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" font-size="25" text-anchor="start" fill="#253d59" font-weight="700">Naive Bayes: from alerts to class probability</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><text x="32" y="149" font-size="20" text-anchor="start" fill="#b34b36" font-weight="700">Fault</text><rect x="155" y="115" width="135" height="74" rx="5" fill="#fff" stroke="#b34b36" stroke-width="1.5"/><text x="222.5" y="146.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Prior</text><text x="222.5" y="170.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.2</text><text x="302" y="159" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">×</text><rect x="315" y="115" width="135" height="74" rx="5" fill="#fff" stroke="#b34b36" stroke-width="1.5"/><text x="382.5" y="146.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Temp.</text><text x="382.5" y="170.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.8</text><text x="462" y="159" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">×</text><rect x="475" y="115" width="135" height="74" rx="5" fill="#fff" stroke="#b34b36" stroke-width="1.5"/><text x="542.5" y="146.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Noise</text><text x="542.5" y="170.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.6</text><text x="622" y="159" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">=</text><rect x="635" y="115" width="135" height="74" rx="5" fill="#fff" stroke="#b34b36" stroke-width="1.5"/><text x="702.5" y="146.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Mass</text><text x="702.5" y="170.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.096</text><text x="32" y="274" font-size="20" text-anchor="start" fill="#18688c" font-weight="700">Normal</text><rect x="155" y="240" width="135" height="74" rx="5" fill="#fff" stroke="#18688c" stroke-width="1.5"/><text x="222.5" y="271.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Prior</text><text x="222.5" y="295.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.8</text><text x="302" y="284" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">×</text><rect x="315" y="240" width="135" height="74" rx="5" fill="#fff" stroke="#18688c" stroke-width="1.5"/><text x="382.5" y="271.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Temp.</text><text x="382.5" y="295.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.1</text><text x="462" y="284" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">×</text><rect x="475" y="240" width="135" height="74" rx="5" fill="#fff" stroke="#18688c" stroke-width="1.5"/><text x="542.5" y="271.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Noise</text><text x="542.5" y="295.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.2</text><text x="622" y="284" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">=</text><rect x="635" y="240" width="135" height="74" rx="5" fill="#fff" stroke="#18688c" stroke-width="1.5"/><text x="702.5" y="271.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Mass</text><text x="702.5" y="295.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">0.016</text><text x="450" y="367" font-size="20" text-anchor="middle" fill="#253d59" font-weight="400">Normalisation: 0.096 + 0.016 = 0.112</text><text x="450" y="409" font-size="23" text-anchor="middle" fill="#b34b36" font-weight="700">P(Fault | both alerts) = 6/7 ≈ 85.7%</text></g></svg>