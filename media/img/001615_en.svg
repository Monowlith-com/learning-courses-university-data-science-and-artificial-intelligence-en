<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Covariance as joint deviation</title><desc>Two equally likely pairs (1,2) and (3,6) lie below left and above right of the mean (2,4).</desc><rect width="900" height="460" fill="white"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Covariance as joint deviation</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><line x1="115.0" y1="130" x2="115.0" y2="370" stroke="#e0e5eb" stroke-width="1"/><text x="115.0" y="395" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">0</text><line x1="228.75" y1="130" x2="228.75" y2="370" stroke="#e0e5eb" stroke-width="1"/><text x="228.75" y="395" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">1</text><line x1="342.5" y1="130" x2="342.5" y2="370" stroke="#e0e5eb" stroke-width="1"/><text x="342.5" y="395" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">2</text><line x1="456.25" y1="130" x2="456.25" y2="370" stroke="#e0e5eb" stroke-width="1"/><text x="456.25" y="395" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">3</text><line x1="570.0" y1="130" x2="570.0" y2="370" stroke="#e0e5eb" stroke-width="1"/><text x="570.0" y="395" font-size="15" text-anchor="middle" fill="#263747" font-weight="400">4</text><line x1="115" y1="370.0" x2="570" y2="370.0" stroke="#e0e5eb" stroke-width="1"/><text x="103" y="375.0" font-size="15" text-anchor="end" fill="#263747" font-weight="400">0</text><line x1="115" y1="310.0" x2="570" y2="310.0" stroke="#e0e5eb" stroke-width="1"/><text x="103" y="315.0" font-size="15" text-anchor="end" fill="#263747" font-weight="400">2</text><line x1="115" y1="250.0" x2="570" y2="250.0" stroke="#e0e5eb" stroke-width="1"/><text x="103" y="255.0" font-size="15" text-anchor="end" fill="#263747" font-weight="400">4</text><line x1="115" y1="190.0" x2="570" y2="190.0" stroke="#e0e5eb" stroke-width="1"/><text x="103" y="195.0" font-size="15" text-anchor="end" fill="#263747" font-weight="400">6</text><line x1="115" y1="130.0" x2="570" y2="130.0" stroke="#e0e5eb" stroke-width="1"/><text x="103" y="135.0" font-size="15" text-anchor="end" fill="#263747" font-weight="400">8</text><line x1="115" y1="250.0" x2="570" y2="250.0" stroke="#b66a26" stroke-width="2"/><line x1="342.5" y1="130" x2="342.5" y2="370" stroke="#b66a26" stroke-width="2"/><circle cx="228.75" cy="310.0" r="5" fill="#245e91"/><text x="218.75" y="297.0" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">(1,2)</text><circle cx="456.25" cy="190.0" r="5" fill="#245e91"/><text x="471.25" y="177.0" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">(3,6)</text><text x="340" y="425" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">X</text><text x="75" y="120" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Y</text><text x="610" y="165" font-size="18" text-anchor="start" fill="#263747" font-weight="400">Means: (2,4)</text><text x="610" y="217" font-size="18" text-anchor="start" fill="#263747" font-weight="400">Products:</text><text x="610" y="248" font-size="18" text-anchor="start" fill="#263747" font-weight="400">(−1) · (−2) = 2</text><text x="610" y="281" font-size="18" text-anchor="start" fill="#263747" font-weight="400">(+1) · (+2) = 2</text><text x="610" y="340" font-size="23" text-anchor="start" fill="#245e91" font-weight="600">Covariance = 2</text></svg>