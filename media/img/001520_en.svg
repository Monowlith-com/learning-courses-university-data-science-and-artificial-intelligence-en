<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Base rate and informativeness of an alarm</title><desc>Among 10,000 components, 180 true and 490 false alarms are expected; 180 of 670 alarms represent real defects.</desc><rect width="900" height="460" fill="white"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Base rate and informativeness of an alarm</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><text x="55" y="127" font-size="19" text-anchor="start" fill="#263747" font-weight="400">10,000 components (expected counts)</text><rect x="55" y="150" width="790" height="50" fill="#e5ebef" stroke="#a6afb8" stroke-width="1.5"/><rect x="55" y="150" width="15.8" height="50" fill="#245e91" stroke="#245e91" stroke-width="1.5"/><line x1="63" y1="150" x2="63" y2="134" stroke="#245e91" stroke-width="2"/><text x="55" y="228" font-size="18" text-anchor="start" fill="#245e91" font-weight="400">200 defective</text><text x="845" y="228" font-size="18" text-anchor="end" fill="#263747" font-weight="400">9,800 fault-free</text><text x="55" y="280" font-size="19" text-anchor="start" fill="#263747" font-weight="400">670 alarms (expanded view)</text><rect x="55" y="300" width="212.23880597014926" height="65" fill="#245e91" stroke="#245e91" stroke-width="1.5"/><rect x="267.23880597014926" y="300" width="577.7611940298507" height="65" fill="#f0c8a5" stroke="#b66a26" stroke-width="1.5"/><text x="161.11940298507463" y="340" font-size="20" text-anchor="middle" fill="white" font-weight="600">180 true</text><text x="556.1194029850747" y="340" font-size="20" text-anchor="middle" fill="#263747" font-weight="400">490 false</text><text x="450" y="418" font-size="23" text-anchor="middle" fill="#263747" font-weight="600">P(defect | alarm) = 180 / 670 ≈ 26.9%</text></svg>