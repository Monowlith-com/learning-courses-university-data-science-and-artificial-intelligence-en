<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Probability as integrated density</title><desc>Uniform distribution from 0 to 4 seconds; the area between 1 and 3 seconds equals 0.5.</desc><rect width="900" height="460" fill="white"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Probability as integrated density</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><text x="65" y="110" font-size="17" text-anchor="start" fill="#263747" font-weight="400">Density [1/s]</text><rect x="295" y="185" width="330" height="175" fill="#b7d8ed" stroke="#245e91" stroke-width="1.5"/><line x1="130" y1="360" x2="130" y2="185" stroke="#245e91" stroke-width="3"/><line x1="130" y1="185" x2="790" y2="185" stroke="#245e91" stroke-width="3"/><line x1="790" y1="185" x2="790" y2="360" stroke="#245e91" stroke-width="3"/><line x1="100" y1="360" x2="850" y2="360" stroke="#526171" stroke-width="2"/><line x1="130" y1="360" x2="130" y2="120" stroke="#526171" stroke-width="2"/><text x="117" y="190" font-size="17" text-anchor="end" fill="#263747" font-weight="400">0.25</text><line x1="130" y1="360" x2="130" y2="366" stroke="#526171" stroke-width="2"/><text x="130" y="385" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">0</text><line x1="295" y1="360" x2="295" y2="366" stroke="#526171" stroke-width="2"/><text x="295" y="385" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">1</text><line x1="460" y1="360" x2="460" y2="366" stroke="#526171" stroke-width="2"/><text x="460" y="385" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">2</text><line x1="625" y1="360" x2="625" y2="366" stroke="#526171" stroke-width="2"/><text x="625" y="385" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">3</text><line x1="790" y1="360" x2="790" y2="366" stroke="#526171" stroke-width="2"/><text x="790" y="385" font-size="17" text-anchor="middle" fill="#263747" font-weight="400">4</text><text x="460" y="266" font-size="24" text-anchor="middle" fill="#263747" font-weight="600">Area = 0.5</text><text x="460" y="425" font-size="19" text-anchor="middle" fill="#263747" font-weight="400">Waiting time [s]</text></svg>