<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>ETL and ELT compared</title><desc>ETL transforms before loading; ELT first loads into the target area and transforms there.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627180"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="32" y="43" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#26313d">ETL and ELT compared</text><line x1="32" y1="62" x2="868" y2="62" stroke="#c9ced4" stroke-width="1"/><text x="58" y="175" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#26313d">ETL</text><rect x="130" y="150" width="190" height="66" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="225.0" y="189.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Extract</text><rect x="380" y="150" width="190" height="66" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="475.0" y="189.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Transform</text><rect x="630" y="150" width="190" height="66" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="725.0" y="189.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Load: target</text><line x1="320" y1="183" x2="380" y2="183" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="183" x2="630" y2="183" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><text x="58" y="325" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#26313d">ELT</text><rect x="130" y="300" width="190" height="66" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="225.0" y="339.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Extract</text><rect x="380" y="300" width="190" height="66" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="475.0" y="339.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Load: staging</text><rect x="630" y="300" width="190" height="66" rx="5" fill="#e9f1f7" stroke="#245b86" stroke-width="1.6"/><text x="725.0" y="339.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#26313d">Transform</text><line x1="320" y1="333" x2="380" y2="333" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><line x1="570" y1="333" x2="630" y2="333" stroke="#627180" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="405" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#627180">Validation, access protection and recovery apply to both approaches.</text></svg>
