<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><rect width="900" height="460" fill="#fff"/><text x="34" y="35" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="start" fill="#263443" font-weight="bold">Base rates and conditional proportions</text><text x="34" y="64" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" fill="#66727e" font-weight="normal">Expected frequencies derived from theoretical probabilities.</text><line x1="34" y1="82" x2="866" y2="82" stroke="#c8d1d8" stroke-width="1"/><text x="450" y="124" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" fill="#263443" font-weight="bold">Expected frequencies for 1,000 components</text><rect x="100" y="148" width="560" height="55" fill="#edf4f8" stroke="#c8d1d8" rx="4"/><text x="380.0" y="181" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#263443" font-weight="normal">Line A: 800</text><rect x="660" y="148" width="140" height="55" fill="#e9f5f1" stroke="#c8d1d8" rx="4"/><text x="730.0" y="181" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#263443" font-weight="normal">B: 200</text><text x="450" y="242" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" fill="#263443" font-weight="bold">Among the 20 expected defective components</text><rect x="100" y="262" width="280" height="65" fill="#edf4f8" stroke="#c8d1d8" rx="4"/><rect x="380" y="262" width="420" height="65" fill="#e9f5f1" stroke="#c8d1d8" rx="4"/><text x="240" y="301" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" fill="#263443" font-weight="normal">A: 8 (40%)</text><text x="590" y="301" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" fill="#263443" font-weight="normal">B: 12 (60%)</text><text x="450" y="389" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#263443" font-weight="normal">Defect rates: 8/800 = 1%; 12/200 = 6%</text><text x="450" y="425" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" fill="#287b69" font-weight="bold">Conditional on a defect: 12/20 = 60%</text></svg>