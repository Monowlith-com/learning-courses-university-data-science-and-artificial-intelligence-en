<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Four measurement scales compared</title><desc>Examples and permissible statements for nominal, ordinal, interval and ratio scales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#253d59"><text x="32" y="45" font-size="25" font-weight="700">Four measurement scales compared</text><path d="M32 65 H868" stroke="#d1d5db" stroke-width="1.5"/><path d="M35 155H865" stroke="#d1d5db"/><text x="45" y="130" font-size="19" text-anchor="start" font-weight="700">Nominal</text><text x="255" y="130" font-size="18" text-anchor="start">City bike / cargo bike</text><text x="590" y="130" font-size="18" text-anchor="start">same or different</text><path d="M35 230H865" stroke="#d1d5db"/><text x="45" y="205" font-size="19" text-anchor="start" font-weight="700">Ordinal</text><text x="255" y="205" font-size="18" text-anchor="start">minor / moderate / severe</text><text x="590" y="205" font-size="18" text-anchor="start">order</text><path d="M35 305H865" stroke="#d1d5db"/><text x="45" y="280" font-size="19" text-anchor="start" font-weight="700">Interval</text><text x="255" y="280" font-size="18" text-anchor="start">10 °C / 20 °C</text><text x="590" y="280" font-size="18" text-anchor="start">difference: 10 °C</text><path d="M35 380H865" stroke="#d1d5db"/><text x="45" y="355" font-size="19" text-anchor="start" font-weight="700">Ratio</text><text x="255" y="355" font-size="18" text-anchor="start">20 min / 40 min</text><text x="590" y="355" font-size="18" text-anchor="start">ratio: 2</text></g></svg>