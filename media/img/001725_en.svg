<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Scaling without data leakage</title><desc>Training values determine mean 12 and standard deviation approximately 1.633. The new value 18 uses the same parameters without refitting the transformation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687985"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" fill="#253d59" font-weight="700">Scaling without data leakage</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><rect x="34" y="106" width="175" height="86" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="121.5" y="144.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Training</text><text x="121.5" y="166.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">10, 12, 14</text><rect x="264" y="106" width="280" height="86" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="404.0" y="144.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Mean and spread</text><text x="404.0" y="166.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">μ = 12; s ≈ 1.633</text><rect x="608" y="106" width="255" height="86" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="735.5" y="155.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Fit model</text><line x1="209" y1="149" x2="264" y2="149" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><line x1="544" y1="149" x2="608" y2="149" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="265" width="175" height="86" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="121.5" y="303.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">New value</text><text x="121.5" y="325.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">18</text><rect x="264" y="265" width="280" height="86" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="404.0" y="303.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Fixed transformation</text><text x="404.0" y="325.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">(18 − 12) / 1.633</text><rect x="608" y="265" width="255" height="86" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="735.5" y="303.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Prediction</text><text x="735.5" y="325.0" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">from z ≈ 3.674</text><line x1="209" y1="308" x2="264" y2="308" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><line x1="544" y1="308" x2="608" y2="308" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><line x1="405" y1="192" x2="405" y2="265" stroke="#687985" stroke-width="2" marker-end="url(#a)"/><text x="419" y="234" text-anchor="start" font-size="16" fill="#253d59" font-weight="400">use</text><text x="450" y="420" text-anchor="middle" font-size="18" fill="#253d59" font-weight="400">New values do not change the learned scaling parameters.</text></g></svg>