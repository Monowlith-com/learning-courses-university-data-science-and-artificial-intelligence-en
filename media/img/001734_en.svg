<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Random forest: two sources of randomness</title><desc>Three bootstrap samples lead to trees with example random feature subsets per node; outputs are averaged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8392a1"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" font-size="25" text-anchor="start" fill="#253d59" font-weight="700">Random forest: two sources of randomness</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><rect x="320" y="91" width="260" height="58" rx="5" fill="#fff" stroke="#253d59" stroke-width="1.5"/><text x="450.0" y="126.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Training set</text><line x1="450" y1="149" x2="170" y2="192" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="58" y="192" width="224" height="63" rx="5" fill="#fff" stroke="#18688c" stroke-width="1.5"/><text x="170.0" y="217.5" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Bootstrap 1</text><text x="170.0" y="241.5" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">1, 1, 3, 4</text><line x1="170" y1="255" x2="170" y2="292" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="58" y="292" width="224" height="72" rx="5" fill="#fff" stroke="#27765a" stroke-width="1.5"/><text x="170.0" y="322.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="700">Tree: features</text><text x="170.0" y="346.0" font-size="18" text-anchor="middle" fill="#253d59" font-weight="400">x₁, x₃</text><line x1="170" y1="364" x2="450" y2="396" stroke="#8392a1" stroke-width="2" marker-end="url(#arrow)"/><line x1="450" y1="149" x2="450" y2="192" stroke="#8392a1" stroke-width="2" marker-en