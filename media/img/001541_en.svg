<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>From data value to decision</title><desc>Four stages from a raw value via measurement context and estimation to a capacity decision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#253d59"><text x="32" y="45" font-size="25" font-weight="700">From data value to decision</text><path d="M32 65 H868" stroke="#d1d5db" stroke-width="1.5"/><rect x="28" y="160" width="190" height="100" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="123.0" y="203.5" font-size="17" text-anchor="middle" font-weight="700">Raw value</text><text x="123.0" y="228.5" font-size="17" text-anchor="middle">18</text><path d="M218 210 L244 210" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><rect x="246" y="160" width="190" height="100" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="341.0" y="203.5" font-size="14" text-anchor="middle" font-weight="700">Measurement context</text><text x="341.0" y="228.5" font-size="17" text-anchor="middle">Work time in min</text><path d="M436 210 L462 210" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="160" width="190" height="100" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="559.0" y="203.5" font-size="17" text-anchor="middle" font-weight="700">Model</text><text x="559.0" y="228.5" font-size="17" text-anchor="middle">Estimate: 30 min</text><path d="M654 210 L680 210" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><rect x="682" y="160" width="190" height="100" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="777.0" y="203.5" font-size="17" text-anchor="middle" font-weight="700">Decision</text><text x="777.0" y="228.5" font-size="17" text-anchor="middle">Capacity: 25 min</text><text x="450" y="320" font-size="19" text-anchor="middle">Measurement and estimation are not the same.</text><text x="450" y="350" font-size="18" text-anchor="middle">The capacity constraint is part of the decision rule.</text></g></svg>