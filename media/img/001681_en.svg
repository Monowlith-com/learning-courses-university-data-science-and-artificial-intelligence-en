<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Regression errors against a baseline</title><desc>Three evaluation values of 2, 4, 6 hours, model values of 3, 3, 5 and baseline 4, 4, 4; lines connect observations with predictions.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687985"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" fill="#253d59" font-weight="700">Regression errors against a baseline</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><line x1="100" y1="390" x2="815" y2="390" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="396" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">0</text><line x1="100" y1="346" x2="815" y2="346" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="352" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">1</text><line x1="100" y1="302" x2="815" y2="302" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="308" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">2</text><line x1="100" y1="258" x2="815" y2="258" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="264" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">3</text><line x1="100" y1="214" x2="815" y2="214" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="220" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">4</text><line x1="100" y1="170" x2="815" y2="170" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="176" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">5</text><line x1="100" y1="126" x2="815" y2="126" stroke="#e3e7eb" stroke-width="1"/><text x="85" y="132" text-anchor="end" font-size="16" fill="#253d59" font-weight="400">6</text><line x1="100" y1="390" x2="815" y2="390" stroke="#687985" stroke-width="2"/><line x1="100" y1="390" x2="100" y2="105" stroke="#687985" stroke-width="2"/><text x="35" y="95" text-anchor="start" font-size="16" fill="#253d59" font-weight="400">Hours</text><line x1="196" y1="302" x2="220" y2="258" stroke="#18688c" stroke-width="2"/><line x1="196" y1="302" x2="248" y2="214" stroke="#ba6632" stroke-width="2"/><circle cx="196" cy="302" r="7" fill="#253d59"/><circle cx="220" cy="258" r="6" fill="#18688c"/><rect x="242" y="208" width="12" height="12" rx="0" fill="#ba6632" stroke="#ba6632" stroke-width="1.5"/><text x="220" y="416" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Case 1</text><line x1="431" y1="214" x2="455" y2="258" stroke="#18688c" stroke-width="2"/><line x1="431" y1="214" x2="483" y2="214" stroke="#ba6632" stroke-width="2"/><circle cx="431" cy="214" r="7" fill="#253d59"/><circle cx="455" cy="258" r="6" fill="#18688c"/><rect x="477" y="208" width="12" height="12" rx="0" fill="#ba6632" stroke="#ba6632" stroke-width="1.5"/><text x="455" y="416" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Case 2</text><line x1="666" y1="126" x2="690" y2="170" stroke="#18688c" stroke-width="2"/><line x1="666" y1="126" x2="718" y2="214" stroke="#ba6632" stroke-width="2"/><circle cx="666" cy="126" r="7" fill="#253d59"/><circle cx="690" cy="170" r="6" fill="#18688c"/><rect x="712" y="208" width="12" height="12" rx="0" fill="#ba6632" stroke="#ba6632" stroke-width="1.5"/><text x="690" y="416" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">Case 3</text><circle cx="190" cy="89" r="6" fill="#253d59"/><text x="205" y="95" text-anchor="start" font-size="16" fill="#253d59" font-weight="400">Actual</text><circle cx="370" cy="89" r="6" fill="#18688c"/><text x="385" y="95" text-anchor="start" font-size="16" fill="#253d59" font-weight="400">Model</text><circle cx="575" cy="89" r="6" fill="#ba6632"/><text x="590" y="95" text-anchor="start" font-size="16" fill="#253d59" font-weight="400">Baseline = 4 h</text><text x="450" y="448" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">MAE: model 1 h; baseline 4/3 h</text></g></svg>