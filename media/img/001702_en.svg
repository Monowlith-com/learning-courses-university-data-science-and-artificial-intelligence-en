<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Linear stretching of the unit circle</title><desc>The matrix diag(4, 1) stretches the unit circle into an ellipse with semi-axes four and one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" font-weight="700" fill="#253d59">Linear stretching of the unit circle</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><line x1="83" y1="230" x2="207" y2="230" stroke="#9daab6" stroke-width="1.5"/><line x1="145" y1="150" x2="145" y2="310" stroke="#9daab6" stroke-width="1.5"/><ellipse cx="145" cy="230" rx="50" ry="50" fill="none" stroke="#1c6585" stroke-width="2.5"/><line x1="145" y1="230" x2="195" y2="230" stroke="#18688c" stroke-width="3" marker-end="url(#arrow)"/><line x1="145" y1="230" x2="145" y2="180" stroke="#ba6632" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#253d59">Unit circle</text><text x="170.0" y="218" text-anchor="middle" font-size="17" font-weight="normal" fill="#253d59">1</text><text x="154" y="193" text-anchor="start" font-size="17" font-weight="normal" fill="#253d59">1</text><line x1="418" y1="230" x2="842" y2="230" stroke="#9daab6" stroke-width="1.5"/><line x1="630" y1="150" x2="630" y2="310" stroke="#9daab6" stroke-width="1.5"/><ellipse cx="630" cy="230" rx="200" ry="50" fill="none" stroke="#1c6585" stroke-width="2.5"/><line x1="630" y1="230" x2="830" y2="230" stroke="#18688c" stroke-width="3" marker-end="url(#arrow)"/><line x1="630" y1="230" x2="630" y2="180" stroke="#ba6632" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#253d59">Image ellipse</text><text x="730.0" y="218" text-anchor="middle" font-size="17" font-weight="normal" fill="#253d59">4</text><text x="639" y="193" text-anchor="start" font-size="17" font-weight="normal" fill="#253d59">1</text><line x1="235" y1="230" x2="400" y2="230" stroke="#758b9c" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="210" text-anchor="middle" font-size="17" font-weight="normal" fill="#253d59">diag(4, 1)</text><text x="450" y="385" text-anchor="middle" font-size="17" font-weight="normal" fill="#253d59">Same scale: 50 pixels per unit length</text></g></svg>