<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Confusion matrix for defect alerts</title><desc>Matrix with actual state in rows and prediction in columns: 24 TP, 6 FN, 16 FP, 154 TN; metrics alongside.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687985"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" fill="#253d59" font-weight="700">Confusion matrix for defect alerts</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><text x="420" y="100" text-anchor="middle" font-size="19" fill="#253d59" font-weight="700">Prediction</text><text x="323" y="135" text-anchor="middle" font-size="18" fill="#253d59" font-weight="400">Defect</text><text x="515" y="135" text-anchor="middle" font-size="18" fill="#253d59" font-weight="400">No defect</text><text x="33" y="254" text-anchor="start" font-size="17" fill="#253d59" font-weight="700">Actual</text><text x="224" y="210" text-anchor="end" font-size="17" fill="#253d59" font-weight="400">Defect</text><text x="224" y="315" text-anchor="end" font-size="17" fill="#253d59" font-weight="400">No defect</text><rect x="235" y="155" width="176" height="93" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="323" y="185" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">TP</text><text x="323" y="221" text-anchor="middle" font-size="28" fill="#253d59" font-weight="700">24</text><rect x="427" y="155" width="176" height="93" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="515" y="185" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">FN</text><text x="515" y="221" text-anchor="middle" font-size="28" fill="#253d59" font-weight="700">6</text><rect x="235" y="260" width="176" height="93" rx="5" fill="#f5e8de" stroke="#a4b7c5" stroke-width="1.5"/><text x="323" y="290" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">FP</text><text x="323" y="326" text-anchor="middle" font-size="28" fill="#253d59" font-weight="700">16</text><rect x="427" y="260" width="176" height="93" rx="5" fill="#e7eff4" stroke="#a4b7c5" stroke-width="1.5"/><text x="515" y="290" text-anchor="middle" font-size="17" fill="#253d59" font-weight="400">TN</text><text x="515" y="326" text-anchor="middle" font-size="28" fill="#253d59" font-weight="700">154</text><text x="642" y="177" text-anchor="start" font-size="18" fill="#253d59" font-weight="400">Precision = 60%</text><text x="642" y="222" text-anchor="start" font-size="18" fill="#253d59" font-weight="400">Recall = 80%</text><text x="642" y="267" text-anchor="start" font-size="18" fill="#253d59" font-weight="400">Accuracy = 89%</text><text x="642" y="312" text-anchor="start" font-size="18" fill="#253d59" font-weight="400">F1 ≈ 68.6%</text><text x="450" y="420" text-anchor="middle" font-size="18" fill="#253d59" font-weight="400">200 devices, of which 30 are actually defective.</text></g></svg>