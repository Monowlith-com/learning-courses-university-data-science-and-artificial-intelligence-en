<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Two distances between measurement profiles</title><desc>The straight line between (3, 1) and (1, 3) has length √8; the axis-aligned path has length 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="45" text-anchor="start" font-size="25" font-weight="700" fill="#253d59">Two distances between measurement profiles</text><line x1="32" y1="65" x2="868" y2="65" stroke="#d1d5db" stroke-width="1.5"/><line x1="138" y1="355" x2="457.1" y2="355" stroke="#8392a1" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="150" y1="367" x2="150" y2="103.4" stroke="#8392a1" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="224" y1="351" x2="224" y2="359" stroke="#758b9c" stroke-width="2"/><text x="224" y="378" text-anchor="middle" font-size="14" font-weight="normal" fill="#253d59">1</text><line x1="298" y1="351" x2="298" y2="359" stroke="#758b9c" stroke-width="2"/><text x="298" y="378" text-anchor="middle" font-size="14" font-weight="normal" fill="#253d59">2</text><line x1="372" y1="351" x2="372" y2="359" stroke="#758b9c" stroke-width="2"/><text x="372" y="378" text-anchor="middle" font-size="14" font-weight="normal" fill="#253d59">3</text><line x1="146" y1="281" x2="154" y2="281" stroke="#758b9c" stroke-width="2"/><text x="138" y="286" text-anchor="end" font-size="14" font-weight="normal" fill="#253d59">1</text><line x1="146" y1="207" x2="154" y2="207" stroke="#758b9c" stroke-width="2"/><text x="138" y="212" text-anchor="end" font-size="14" font-weight="normal" fill="#253d59">2</text><text x="466.1" y="360" text-anchor="start" font-size="16" font-weight="normal" fill="#253d59">x</text><text x="157" y="94.4" text-anchor="start" font-size="16" font-weight="normal" fill="#253d59">y</text><line x1="372" y1="281" x2="224" y2="133" stroke="#18688c" stroke-width="3"/><line x1="372" y1="281" x2="372" y2="133" stroke="#ba6632" stroke-width="3" stroke-dasharray="6 5"/><line x1="372" y1="133" x2="224" y2="133" stroke="#ba6632" stroke-width="3" stroke-dasharray="6 5"/><circle cx="372" cy="281" r="5" fill="#1c6585"/><circle cx="224" cy="133" r="5" fill="#1c6585"/><text x="384" y="291" text-anchor="start" font-size="17" font-weight="normal" fill="#253d59">a = (3, 1)</text><text x="234" y="123" text-anchor="start" font-size="17" font-weight="normal" fill="#253d59">b = (1, 3)</text><text x="550" y="155" text-anchor="start" font-size="20" font-weight="700" fill="#253d59">Direct distance (L₂)</text><text x="550" y="187" text-anchor="start" font-size="22" font-weight="normal" fill="#253d59">√(2² + 2²) = √8</text><text x="550" y="250" text-anchor="start" font-size="20" font-weight="700" fill="#253d59">Axis-aligned path (L₁)</text><text x="550" y="282" text-anchor="start" font-size="22" font-weight="normal" fill="#253d59">2 + 2 = 4</text><line x1="500" y1="150" x2="535" y2="150" stroke="#18688c" stroke-width="3"/><line x1="500" y1="245" x2="535" y2="245" stroke="#ba6632" stroke-width="3" stroke-dasharray="6 5"/></g></svg>