<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Three types of data-related tasks</title><desc>A workshop question branches into description, prediction and planning.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#253d59"><text x="32" y="45" font-size="25" font-weight="700">Three types of data-related tasks</text><path d="M32 65 H868" stroke="#d1d5db" stroke-width="1.5"/><rect x="315" y="91" width="270" height="75" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="450.0" y="134.5" font-size="17" text-anchor="middle" font-weight="700">Workshop question</text><path d="M450 166 L160 220" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="225" width="250" height="85" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="160.0" y="261.0" font-size="17" text-anchor="middle" font-weight="700">Past jobs</text><text x="160.0" y="286.0" font-size="17" text-anchor="middle">Describe</text><path d="M450 166 L450 220" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="225" width="250" height="85" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="450.0" y="261.0" font-size="17" text-anchor="middle" font-weight="700">New job</text><text x="450.0" y="286.0" font-size="17" text-anchor="middle">Predict</text><path d="M450 166 L740 220" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#arrow)"/><rect x="615" y="225" width="250" height="85" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="740.0" y="261.0" font-size="17" text-anchor="middle" font-weight="700">Shift staffing</text><text x="740.0" y="286.0" font-size="17" text-anchor="middle">Plan</text><text x="450" y="377" font-size="18" text-anchor="middle">A summary measure, a prediction and a schedule are different results.</text></g></svg>