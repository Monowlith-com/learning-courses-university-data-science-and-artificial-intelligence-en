<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Completeness of a data field</title><desc>Six jobs, four recorded durations, two missing values; completeness 66.7 percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456078"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#253d59"><text x="32" y="45" font-size="25" font-weight="700">Completeness of a data field</text><path d="M32 65 H868" stroke="#d1d5db" stroke-width="1.5"/><text x="60" y="103" font-size="18" text-anchor="start" font-weight="700">Job</text><text x="250" y="103" font-size="18" text-anchor="start" font-weight="700">Working time</text><text x="65" y="141" font-size="18" text-anchor="start">A</text><text x="250" y="141" font-size="18" text-anchor="start">15 min</text><path d="M55 153H430" stroke="#d1d5db"/><text x="65" y="184" font-size="18" text-anchor="start">B</text><text x="250" y="184" font-size="18" text-anchor="start">25 min</text><path d="M55 196H430" stroke="#d1d5db"/><text x="65" y="227" font-size="18" text-anchor="start">C</text><text x="250" y="227" font-size="18" text-anchor="start">not recorded</text><path d="M55 239H430" stroke="#d1d5db"/><text x="65" y="270" font-size="18" text-anchor="start">D</text><text x="250" y="270" font-size="18" text-anchor="start">20 min</text><path d="M55 282H430" stroke="#d1d5db"/><text x="65" y="313" font-size="18" text-anchor="start">E</text><text x="250" y="313" font-size="18" text-anchor="start">not recorded</text><path d="M55 325H430" stroke="#d1d5db"/><text x="65" y="356" font-size="18" text-anchor="start">F</text><text x="250" y="356" font-size="18" text-anchor="start">40 min</text><path d="M55 368H430" stroke="#d1d5db"/><rect x="495" y="145" width="340" height="150" rx="7" fill="#fff" stroke="#758b9c" stroke-width="1.6"/><text x="665.0" y="213.5" font-size="17" text-anchor="middle" font-weight="700">4 of 6 values present</text><text x="665.0" y="238.5" font-size="17" text-anchor="middle">66.7% complete</text><text x="665" y="337" font-size="17" text-anchor="middle">Completeness ≠ correctness</text></g></svg>