<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial, sans-serif"><title>Partial statistics and combined reduction</title><desc>Two blocks supply sums and counts, which are combined to obtain 36/5 = 7.2.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526171"/></marker></defs><rect width="900" height="460" fill="#fff"/><text x="40" y="48" font-size="27" text-anchor="start" fill="#263747" font-weight="600">Partial statistics and combined reduction</text><line x1="40" y1="75" x2="860" y2="75" stroke="#d4dbe1" stroke-width="2.3"/><rect x="80" y="110" width="310" height="62" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="235.0" y="148.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Block A: 2, 4, 6</text><rect x="510" y="110" width="310" height="62" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="665.0" y="148.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Block B: 10, 14</text><line x1="235" y1="172" x2="235" y2="224" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="665" y1="172" x2="665" y2="224" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="80" y="224" width="310" height="62" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="235.0" y="262.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Sum 12 · Count 3</text><rect x="510" y="224" width="310" height="62" rx="6" fill="#e8f2fa" stroke="#245e91" stroke-width="2"/><text x="665.0" y="262.0" font-size="18" text-anchor="middle" fill="#263747" font-weight="400">Sum 24 · Count 2</text><line x1="235" y1="286" x2="380" y2="340" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><line x1="665" y1="286" x2="520" y2="340" stroke="#526171" stroke-width="2.3" marker-end="url(#a)"/><rect x="270" y="340" width="360" height="